[project]
name = "game-mcp-memory"
version = "0.1.0"
description = "Local Mem0 sidecar for the simple game client MCP"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "mem0ai>=1,<2",
    "openai>=1,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "qdrant-client>=1.15,<2",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
