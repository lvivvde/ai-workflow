[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-design-knowledge-mcp"
version = "1.1.0"
description = "Local knowledge index and MCP server for game design documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
game-design-knowledge = "game_design_knowledge.cli:main"
game-design-knowledge-mcp = "game_design_knowledge.server:main"

[dependency-groups]
# The image-dependent tests build and read back PNG fixtures, so Pillow is part
# of the development environment `uv sync` materialises by default.
dev = [
    "pillow>=11",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/game_design_knowledge"]
